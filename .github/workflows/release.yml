name: Release Veyra Compiler

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: veyra-linux-x86_64
            asset_name: veyra-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: veyra-macos-universal
            asset_name: veyra-${{ github.ref_name }}-macos-universal.tar.gz
          - os: windows-latest
            artifact_name: veyra-windows-x64
            asset_name: veyra-${{ github.ref_name }}-windows-x64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Linux / macOS
        if: runner.os != 'Windows'
        run: |
          make
          tar -czvf ${{ matrix.asset_name }} -C bin veyra

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          g++ -std=c++20 -O3 -Iinclude src/lexer.cpp src/parser.cpp src/codegen.cpp src/compiler.cpp src/main.cpp -o veyra.exe
          Compress-Archive -Path veyra.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
