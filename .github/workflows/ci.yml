name: CI / Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: macos-latest
            cxx: clang++
          - os: windows-latest
            cxx: g++

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build on Linux / macOS
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          ${{ matrix.cxx }} -std=c++20 -O3 -Iinclude src/lexer.cpp src/parser.cpp src/codegen.cpp src/main.cpp -o bin/veyra
          chmod +x bin/veyra
          ./bin/veyra --version

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir bin -ErrorAction SilentlyContinue
          g++ -std=c++20 -O3 -Iinclude src/lexer.cpp src/parser.cpp src/codegen.cpp src/main.cpp -o bin/veyra.exe
          ./bin/veyra.exe --version

      - name: Run Test Scripts
        run: |
          echo 'println("Testing Veyra CI pipeline...")' > test_ci.vey
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bin/veyra.exe run test_ci.vey
          else
            ./bin/veyra run test_ci.vey
          fi
        shell: bash
